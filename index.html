<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101411">
  <title>Conversa local</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">✳</span><span>conversa<span class="muted"> local</span></span></div>
    <button id="new-chat" class="new-chat"><span>＋</span> Nova conversa</button>
    <div class="history-heading">Conversas</div>
    <nav id="chat-list" class="chat-list" aria-label="Conversas guardadas"></nav>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="model-wrap"><label for="model">MODELO</label><select id="model"><option value="">A procurar modelos…</option></select><button id="refresh" title="Atualizar modelos" aria-label="Atualizar modelos">↻</button></div>
      <div id="connection" class="connection"><span class="dot"></span><span>A ligar…</span></div>
    </header>
    <section id="conversation" class="conversation" aria-live="polite">
      <div id="welcome" class="welcome">
        <h1>Em que posso ajudar?</h1>
        <div class="suggestions">
          <button class="suggestion">Resume um documento</button>
          <button class="suggestion">Analisa uma imagem</button>
          <button class="suggestion">Ajuda-me com uma ideia</button>
        </div>
      </div>
      <div id="messages" class="messages"></div>
    </section>
    <form id="composer" class="composer">
      <div id="attachments" class="attachments"></div>
      <textarea id="prompt" rows="1" placeholder="Escreve uma mensagem…" aria-label="Mensagem"></textarea>
      <div class="composer-footer"><div class="composer-actions"><button id="attach" type="button" aria-label="Anexar ficheiros" title="Anexar ficheiros">＋</button><label class="web-toggle"><input id="web-search" type="checkbox"><span>Pesquisar na Internet</span></label><span class="keyboard-hint">Enter envia · Shift+Enter nova linha</span></div><button id="send" type="submit" aria-label="Enviar mensagem">↑</button></div>
    </form>
    <input id="file-picker" type="file" multiple hidden accept=".txt,.md,.csv,.tsv,.json,.xml,.html,.css,.js,.ts,.py,.java,.c,.cpp,.h,.hpp,.rs,.go,.php,.rb,.sh,.ps1,.yaml,.yml,.toml,.ini,.log,.sql,.r,.ipynb,.pdf,.docx,text/*,image/png,image/jpeg,image/webp,image/gif">
  </main>
  <script src="/app.js"></script>
</body>
</html>
